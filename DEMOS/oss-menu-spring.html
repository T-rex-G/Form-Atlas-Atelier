<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv='Content-Security-Policy' content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; font-src 'none'; connect-src 'none'"><title>spring menu</title><style>*{box-sizing:border-box}html,body,#root{margin:0;width:100%;height:100%;overflow:hidden}body{font-family:Inter,ui-sans-serif,Arial,sans-serif;background:#101317;color:#f4f0e9}.stage{min-height:100%;display:grid;place-content:center;padding:38px}.stack{display:flex;flex-direction:column;align-items:center;gap:22px}.sub{font-size:11px;color:#b9b1a3;letter-spacing:.12em;text-transform:uppercase}.display{font-size:54px;line-height:1.1;letter-spacing:-2px;font-weight:500}.pill{background:#e6cfa4;color:#1a1711;border:0;border-radius:99px;padding:14px 26px;font-size:14px;cursor:pointer}.panel{position:relative;isolation:isolate;width:320px;max-width:75vw;padding:30px;border:1px solid #45413a;border-radius:18px;background:#171b20}.demo-title{position:absolute;left:26px;top:22px;font-size:11px;color:#b7b1a6;letter-spacing:.1em;text-transform:uppercase}.demo-hint{position:absolute;bottom:20px;right:24px;font-size:10px;color:#9b978e}button{font:inherit;cursor:pointer}button:focus-visible{outline:2px solid #d6bc8d;outline-offset:4px}.lines{line-height:1.8;font-size:35px;letter-spacing:-1px}.small-text{font-size:14px;line-height:1.7;color:#b8b2a9}.accent{color:#e6cfa4}@media(max-width:450px){.display{font-size:40px}.stage{padding:25px}.panel{width:270px;padding:22px}}
/*!
 * Hamburgers
 * @description Tasty CSS-animated hamburgers
 * @author Jonathan Suh @jonsuh
 * @site https://jonsuh.com/hamburgers
 * @link https://github.com/jonsuh/hamburgers
 */
.hamburger {
  padding: 15px 15px;
  display: inline-block;
  cursor: pointer;
  transition-property: opacity, filter;
  transition-duration: 0.15s;
  transition-timing-function: linear;
  font: inherit;
  color: inherit;
  text-transform: none;
  background-color: transparent;
  border: 0;
  margin: 0;
  overflow: visible; }
  .hamburger:hover {
    opacity: 0.7; }
  .hamburger.is-active:hover {
    opacity: 0.7; }
  .hamburger.is-active .hamburger-inner,
  .hamburger.is-active .hamburger-inner::before,
  .hamburger.is-active .hamburger-inner::after {
    background-color: #000; }

.hamburger-box {
  width: 40px;
  height: 24px;
  display: inline-block;
  position: relative; }

.hamburger-inner {
  display: block;
  top: 50%;
  margin-top: -2px; }
  .hamburger-inner, .hamburger-inner::before, .hamburger-inner::after {
    width: 40px;
    height: 4px;
    background-color: #000;
    border-radius: 4px;
    position: absolute;
    transition-property: transform;
    transition-duration: 0.15s;
    transition-timing-function: ease; }
  .hamburger-inner::before, .hamburger-inner::after {
    content: "";
    display: block; }
  .hamburger-inner::before {
    top: -10px; }
  .hamburger-inner::after {
    bottom: -10px; }

/*
   * Spring
   */
.hamburger--spring .hamburger-inner {
  top: 2px;
  transition: background-color 0s 0.13s linear; }
  .hamburger--spring .hamburger-inner::before {
    top: 10px;
    transition: top 0.1s 0.2s cubic-bezier(0.33333, 0.66667, 0.66667, 1), transform 0.13s cubic-bezier(0.55, 0.055, 0.675, 0.19); }
  .hamburger--spring .hamburger-inner::after {
    top: 20px;
    transition: top 0.2s 0.2s cubic-bezier(0.33333, 0.66667, 0.66667, 1), transform 0.13s cubic-bezier(0.55, 0.055, 0.675, 0.19); }

.hamburger--spring.is-active .hamburger-inner {
  transition-delay: 0.22s;
  background-color: transparent !important; }
  .hamburger--spring.is-active .hamburger-inner::before {
    top: 0;
    transition: top 0.1s 0.15s cubic-bezier(0.33333, 0, 0.66667, 0.33333), transform 0.13s 0.22s cubic-bezier(0.215, 0.61, 0.355, 1);
    transform: translate3d(0, 10px, 0) rotate(45deg); }
  .hamburger--spring.is-active .hamburger-inner::after {
    top: 0;
    transition: top 0.2s cubic-bezier(0.33333, 0, 0.66667, 0.33333), transform 0.13s 0.22s cubic-bezier(0.215, 0.61, 0.355, 1);
    transform: translate3d(0, 10px, 0) rotate(-45deg); }

.hamburger{filter:invert(85%) sepia(25%) saturate(400%) hue-rotate(355deg);transform:scale(2);padding:30px}</style></head><body><div class="demo-title">spring / navigation</div><div class="stage"><div class="stack"><button aria-label="Toggle navigation" aria-expanded="false" class="hamburger hamburger--spring" type="button"><span class="hamburger-box"><span class="hamburger-inner"></span></span></button><span class="sub">Open. Close. Repeat.</span></div></div><span class="demo-hint">Click to interact</span><script>const b=document.querySelector('button');b.onclick=()=>{const on=b.classList.toggle('is-active');b.setAttribute('aria-expanded',String(on));};</script></body></html>
