<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv='Content-Security-Policy' content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; font-src 'none'; connect-src 'none'"><title>Gradient Pattern 143</title><style>*{box-sizing:border-box}html,body,#root{margin:0;width:100%;height:100%;overflow:hidden}body{font-family:Inter,ui-sans-serif,Arial,sans-serif;background:#101317;color:#f4f0e9}.stage{min-height:100%;display:grid;place-content:center;padding:38px}.stack{display:flex;flex-direction:column;align-items:center;gap:22px}.sub{font-size:11px;color:#b9b1a3;letter-spacing:.12em;text-transform:uppercase}.display{font-size:54px;line-height:1.1;letter-spacing:-2px;font-weight:500}.pill{background:#e6cfa4;color:#1a1711;border:0;border-radius:99px;padding:14px 26px;font-size:14px;cursor:pointer}.panel{position:relative;isolation:isolate;width:320px;max-width:75vw;padding:30px;border:1px solid #45413a;border-radius:18px;background:#171b20}.demo-title{position:absolute;left:26px;top:22px;font-size:11px;color:#b7b1a6;letter-spacing:.1em;text-transform:uppercase}.demo-hint{position:absolute;bottom:20px;right:24px;font-size:10px;color:#9b978e}button{font:inherit;cursor:pointer}button:focus-visible{outline:2px solid #d6bc8d;outline-offset:4px}.lines{line-height:1.8;font-size:35px;letter-spacing:-1px}.small-text{font-size:14px;line-height:1.7;color:#b8b2a9}.accent{color:#e6cfa4}@media(max-width:450px){.display{font-size:40px}.stage{padding:25px}.panel{width:270px;padding:22px}}
html {
  --s: 16px; /* control the size */
  --c1:#E4844A;
  --c2:#0D6759;
  
  --g:radial-gradient(30% 50% at 30% 100%,#0000 66%,var(--c1) 67% 98%,#0000);
  background:
    var(--g),var(--g) calc(5*var(--s)) calc(3*var(--s)),
    repeating-linear-gradient(90deg,var(--c1) 0 10%,var(--c2) 0 50%);
  background-size: calc(10*var(--s)) calc(6*var(--s));
}
html{height:100%}body{background:none}</style></head><body></body></html>
